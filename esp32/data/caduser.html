<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Usuário</title>
    <link rel="stylesheet" href="css/caduser.css">
</head>
<body>

    <div class="cad-box" id="cadbox">

        <h2 id="cad">CADASTRAR USUÁRIO</h2>

        <div id="imgbox-cad">
            <img id="caduser" src="png/user2.png" alt="Usuário">
        </div>

        <form id="formuser"> 

            <input 
                type="text"
                id="nome"
                name="nome"
                placeholder="Usuário"
                required
            >
            <input 
                type="tel"
                pattern="\d{3}\.\d{3}\.\d{3}-\d{2}"
                id="cpf"
                name="cpf"
                placeholder="CPF (000.000.000-00)"
                required
            >

            <input 
                type="password"
                id="senha"
                name="senha"
                placeholder="Senha"
                required
            >
            <input 
                type="number"
                id="saldo"
                name="saldo"
                min="0"
                step="0.01"
                placeholder="Saldo (R$ 0,00)"
                required
            >
            <div id="legenda">
                <legend > O usuário é maior de idade?</legend>
            </div>
            
            <div class="maioridade">
                <div class="sim">
                <input
                    type="radio"
                    id="maioridade1"
                    name="maioridade"
                    value="sim" 
                    checked />
                    
                    <div class="maioridade1">
                <label for="maioridade1">Sim</label>
            </div>
            </div>
            <div class="sim">
                <input 
                    type="radio"
                    id="maioridade2"
                    name="maioridade" 
                    value="nao"/>
                    
                <label for="maioridade2">Não</label>
            </div>
            </div>
            <div>
            <button id="loginbt" type="submit" >Iniciar reconhecimento facial</button>
            </div>
        </form>

    </div>

<div class="home">
  <button class="btn-icon-home" onclick="GoToIndex()">
    <img src="png/house.png" alt="">
  </button>
</div>

    <script src="js/caduser.js"></script>

</body>
</html>
