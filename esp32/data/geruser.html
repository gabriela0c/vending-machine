<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Gerenciar Usuários</title>

    <link rel="stylesheet" href="css/geruser.css">
</head>

<body>

    <div class="list-box">

        <h1 id="gerusers">
            GERENCIAR USUÁRIOS
        </h1>

        <div class="content">

            <div class="identificadores">

                <div class="textc">
                    <span>Nome</span>
                </div>

                <div class="textc">
                    <span>Idade</span>
                </div>

                <div class="textc">
                    <span>Saldo</span>
                </div>
                <div class="textc">
                    <span>Ações</span>
                </div>

            </div>

            <div id="lista-usuarios"></div>

        </div>

        <div class="cad">

            <h1 id="cadusers">
                Cadastrar novo usuário
            </h1>

            <button
                class="btn-icon"
                onclick="GoToCadUser()">

                <img src="png/add.png" alt="">

            </button>

        </div>

    </div>

    <div class="home">

        <button
            class="btn-icon-home"
            onclick="GoToIndex()">

            <img src="png/house.png" alt="">

        </button>

    </div>

    <script src="js/geruser.js"></script>

</body>

</html>
