<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Produtos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="list-box" >

        <h1 id="gerusers">GERENCIAR PRODUTOS</h2>

        <div class="content">

            <div class="identificadores">
                <div class="textc col-nome">
                    <span>Nome</span>
                </div>
                <div class="textc col-preco">
                    <span>Preço</span>
                </div>
                <div class="textc col-class">
                    <span>Classificação</span>
                </div>
                <div class="textc col-estoque">
                    <span>Estoque</span>
                </div>
                <div class="col-acoes" style="color: white; font-size: 18px; text-align: right; padding-right: 15px;">
                    <span>Ações</span>
                </div>
            </div>
            <div id="lista-produtos"></div>
            
           
        </div>
            <div class="cad">
                <div>
                    <h1 id="cadusers">Cadastrar novo produto</h2>
                </div>
                <div>
                        <button class="btn-icon" >
                            <img src="png/add.png" alt="" onclick="GoToCadProd()">
                        </button>
                </div>            
            </div>  
        </div>

    </div>
    

<div class="home">
  <button class="btn-icon-home" onclick="GoToIndex()">
    <img src="png/house.png" alt="">
  </button>
</div>

    <script src="js/gerprod.js"></script>
</body> 
</html>
