<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="login-box" id="loginbox">

        <h2 id="login">USER LOGIN</h2>

        <div id="imgbox">
            <img id="user" src="png/user.png" alt="Usuário">
        </div>

        <form action="./index.html" method="get"> 

            <input 
                type="text"
                id="nome"
                name="nome"
                placeholder="Usuário"
                required
            >

            <input 
                type="password"
                id="senha"
                name="senha"
                placeholder="Senha"
                required
            >

            <button id="loginbt" type="submit">Login →</button>

        </form>

    </div>

</body>
</html>
