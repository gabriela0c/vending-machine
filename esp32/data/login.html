<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="login-box" id="loginbox">

        <h2 id="login">USER LOGIN</h2>

        <div id="imgbox">
            <img id="user" src="png/user.png" alt="Usuário">
        </div>

        <form id="loginForm"> 

            <input 
                type="text"
                id="nome"
                name="nome"
                placeholder="Usuário"
                required
            >

            <input 
                type="password"
                id="senha"
                name="senha"
                placeholder="Senha"
                required
            >

            <button id="loginbt" type="submit">Login →</button>

        </form>

    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            // Evita que a página recarregue ou mude de endereço imediatamente
            event.preventDefault(); 

            // Captura os valores digitados nos inputs
            const usuarioDigitado = document.getElementById('nome').value;
            const senhaDigitada = document.getElementById('senha').value;

            // Validação das credenciais
            if (usuarioDigitado === 'admin' && senhaDigitada === 'admin') {
                // Se estiver correto, redireciona para a index
                window.location.href = './index.html';
            } else {
                // Se estiver incorreto, exibe um alerta e limpa o campo de senha
                alert('Usuário ou senha incorretos!');
                document.getElementById('senha').value = '';
            }
        });
    </script>

</body>
</html>
